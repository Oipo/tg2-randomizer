<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Top Gear 2 Randomizer</title>
<style>
    :root { color-scheme: dark; }
    body {
        font-family: system-ui, sans-serif;
        max-width: 640px;
        margin: 2rem auto;
        padding: 0 1rem;
        background: #16181d;
        color: #e6e6e6;
        line-height: 1.5;
    }
    h1 { margin-bottom: 0.25rem; }
    p.sub { margin-top: 0; color: #9aa0a6; }
    fieldset { border: 1px solid #333; border-radius: 8px; margin: 1rem 0; }
    legend { padding: 0 0.4rem; color: #9aa0a6; }
    label { display: block; margin: 0.4rem 0; }
    .row { display: flex; align-items: center; gap: 0.5rem; }
    input[type="number"] { width: 8rem; }
    .defaults-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 1rem;
    }
    .defaults-grid h3 {
        margin: 0.2rem 0 0.5rem;
        font-size: 1rem;
        color: #e6e6e6;
    }
    .defaults-grid label {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 5rem;
        align-items: center;
        gap: 0.5rem;
        margin: 0.35rem 0;
    }
    .defaults-grid input[type="number"],
    .defaults-grid select {
        width: 100%;
        box-sizing: border-box;
    }
    @media (max-width: 600px) {
        .defaults-grid { grid-template-columns: 1fr; }
    }
    button {
        font-size: 1rem;
        padding: 0.6rem 1.2rem;
        border: 0;
        border-radius: 8px;
        background: #3b82f6;
        color: white;
        cursor: pointer;
    }
    button:disabled { background: #444; cursor: not-allowed; }
    #status { margin-top: 1rem; min-height: 1.5rem; }
    .error { color: #f87171; }
    .ok { color: #4ade80; }
    code { background: #222; padding: 0.1rem 0.3rem; border-radius: 4px; }
    #update-banner {
        position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
        background: #3b82f6; color: #fff; padding: 0.6rem 1rem; text-align: center;
    }
    #update-banner button {
        margin-left: 0.5rem; padding: 0.3rem 0.8rem; font-size: 0.9rem;
        border: 0; border-radius: 6px; background: #fff; color: #1d4ed8;
        font-weight: bold; cursor: pointer;
    }
</style>
</head>
<body>
    <h1>Top Gear 2 Randomizer</h1>
    <p class="sub">Find the source code on <a href="https://github.com/Oipo/tg2-randomizer">github</a>.</p>

    <fieldset>
        <legend>ROM</legend>
        <label>Select your Top Gear 2 (USA) ROM:
            <input type="file" id="rom" accept=".sfc,.smc,.bin">
        </label>
    </fieldset>

    <fieldset>
        <legend>Options</legend>
        <label class="row"><input type="checkbox" id="randomizeTracks" checked> Randomize tracks</label>
        <label class="row"><input type="checkbox" id="rampDroneDifficulty" checked> &nbsp;&nbsp;&mdash; ramp drone difficulty by race order (recommended)</label>
        <label class="row"><input type="checkbox" id="randomizeWeather"> Randomize weather</label>
        <label class="row"><input type="checkbox" id="enableSpaceWeather"> &nbsp;&nbsp;&mdash; include "space" weather</label>
        <label class="row">
            Force weather type:
            <select id="weatherType">
                <option value="">(don't force)</option>
                <option value="0">0 - normal</option>
                <option value="1">1 - normal</option>
                <option value="2">2 - normal</option>
                <option value="3">3 - rain</option>
                <option value="4">4 - snow</option>
                <option value="5">5 - fog</option>
                <option value="6">6 - night</option>
                <option value="7">7 - space</option>
            </select>
        </label>
        <label class="row">
            Seed (optional):
            <input type="number" id="seed" placeholder="random" min="0">
        </label>
    </fieldset>

    <fieldset>
        <legend>New-game car defaults</legend>
        <div class="defaults-grid">
            <section>
                <h3>P1 $1D03-$1D19</h3>
                <label>Engine $1D03 <input type="number" id="startP1Engine" min="0" max="3" step="1"></label>
                <label>Wet tires $1D05 <input type="number" id="startP1WetTires" min="0" max="3" step="1"></label>
                <label>Dry tires $1D07 <input type="number" id="startP1DryTires" min="0" max="3" step="1"></label>
                <label>Gearbox $1D09 <input type="number" id="startP1Gearbox" min="0" max="3" step="1"></label>
                <label>Nitro $1D0B <input type="number" id="startP1Nitro" min="0" max="3" step="1"></label>
                <label>Mystery $1D0D <input type="number" id="startP1Mystery" min="0" max="255" step="1"></label>
                <label>Armour 1 $1D0F <input type="number" id="startP1Armour1" min="0" max="3" step="1"></label>
                <label>Armour 2 $1D11 <input type="number" id="startP1Armour2" min="0" max="3" step="1"></label>
                <label>Armour 3 $1D13 <input type="number" id="startP1Armour3" min="0" max="3" step="1"></label>
                <label>Paint $1D15 <select id="startP1Paint">
                    <option value="">(unchanged)</option>
                    <option value="0">0 - Red</option>
                    <option value="1">1 - Blue</option>
                    <option value="2">2 - White</option>
                    <option value="3">3 - Yellow</option>
                    <option value="4">4 - Green</option>
                    <option value="5">5 - Black</option>
                    <option value="6">6 - Gentleman's Gray</option>
                    <option value="7">7 - Purple</option>
                </select></label>
                <label>Unknown $1D17 <input type="number" id="startP1Unknown" min="0" max="255" step="1"></label>
                <label>Money (in thousands) $1D19 <input type="number" id="startP1Money" min="0" max="255" step="1"></label>
            </section>
            <section>
                <h3>P2 $1D2C-$1D42</h3>
                <label>Engine $1D2C <input type="number" id="startP2Engine" min="0" max="3" step="1"></label>
                <label>Wet tires $1D2E <input type="number" id="startP2WetTires" min="0" max="3" step="1"></label>
                <label>Dry tires $1D30 <input type="number" id="startP2DryTires" min="0" max="3" step="1"></label>
                <label>Gearbox $1D32 <input type="number" id="startP2Gearbox" min="0" max="3" step="1"></label>
                <label>Nitro $1D34 <input type="number" id="startP2Nitro" min="0" max="3" step="1"></label>
                <label>Mystery $1D36 <input type="number" id="startP2Mystery" min="0" max="255" step="1"></label>
                <label>Armour 1 $1D38 <input type="number" id="startP2Armour1" min="0" max="3" step="1"></label>
                <label>Armour 2 $1D3A <input type="number" id="startP2Armour2" min="0" max="3" step="1"></label>
                <label>Armour 3 $1D3C <input type="number" id="startP2Armour3" min="0" max="3" step="1"></label>
                <label>Paint $1D3E <select id="startP2Paint">
                    <option value="">(unchanged)</option>
                    <option value="0">0 - Red</option>
                    <option value="1">1 - Blue</option>
                    <option value="2">2 - White</option>
                    <option value="3">3 - Yellow</option>
                    <option value="4">4 - Green</option>
                    <option value="5">5 - Black</option>
                    <option value="6">6 - Gentleman's Gray</option>
                    <option value="7">7 - Purple</option>
                </select></label>
                <label>Unknown $1D40 <input type="number" id="startP2Unknown" min="0" max="255" step="1"></label>
                <label>Money (in thousands) $1D42 <input type="number" id="startP2Money" min="0" max="255" step="1"></label>
            </section>
        </div>
    </fieldset>

    <button id="go" disabled>Loading…</button>
    <div id="status"></div>

    <!-- MODULARIZE output: defines the global factory createTg2Randomizer() -->
    <script src="tg2-randomizer.js"></script>
    <script>
    (function () {
        const fileInput = document.getElementById('rom');
        const goBtn = document.getElementById('go');
        const statusEl = document.getElementById('status');
        let wasm = null;

        function setStatus(msg, cls) {
            statusEl.textContent = msg;
            statusEl.className = cls || '';
        }

        createTg2Randomizer().then(function (Module) {
            wasm = Module;
            goBtn.textContent = 'Randomize';
            goBtn.disabled = false;
        }).catch(function (e) {
            setStatus('Failed to load WASM module: ' + e, 'error');
        });

        // --- "new version available" notice --------------------------------
        // APP_VERSION is a content hash stamped in by build-wasm.sh. version.json
        // (written next to the files) carries the version currently on the server;
        // if it differs from this loaded page, a newer build has been deployed.
        const APP_VERSION = '__APP_VERSION__';

        function showUpdateBanner() {
            if (document.getElementById('update-banner')) return;
            const bar = document.createElement('div');
            bar.id = 'update-banner';
            bar.innerHTML = 'A new version is available. <button id="reloadBtn">Reload</button>';
            document.body.appendChild(bar);
            document.getElementById('reloadBtn').addEventListener('click', function () {
                location.reload();
            });
        }

        async function checkForUpdate() {
            if (APP_VERSION.charAt(0) === '_') return;  // unstamped (raw source) — skip
            try {
                const r = await fetch('version.json?t=' + Date.now(), { cache: 'no-store' });
                if (!r.ok) return;
                const latest = (await r.json()).version;
                if (latest && latest !== APP_VERSION) showUpdateBanner();
            } catch (e) { /* offline or no version.json — ignore */ }
        }

        checkForUpdate();
        setInterval(checkForUpdate, 5 * 60 * 1000);
        document.addEventListener('visibilitychange', function () {
            if (!document.hidden) checkForUpdate();
        });

        function buildOptions() {
            const opts = {
                randomizeTracks: document.getElementById('randomizeTracks').checked,
                rampDroneDifficulty: document.getElementById('rampDroneDifficulty').checked,
                randomizeWeather: document.getElementById('randomizeWeather').checked,
                enableSpaceWeather: document.getElementById('enableSpaceWeather').checked,
            };
            const wt = document.getElementById('weatherType').value;
            if (wt !== '') opts.weatherType = parseInt(wt, 10);
            // Always resolve to a concrete 32-bit seed (mt19937 is seeded with a
            // uint32), so even "random" runs are reproducible and can be shown.
            const seed = document.getElementById('seed').value;
            opts.seed = (seed !== '') ? (parseInt(seed, 10) >>> 0)
                                      : crypto.getRandomValues(new Uint32Array(1))[0];
            [
                'startP1Engine',
                'startP1WetTires',
                'startP1DryTires',
                'startP1Gearbox',
                'startP1Nitro',
                'startP1Mystery',
                'startP1Armour1',
                'startP1Armour2',
                'startP1Armour3',
                'startP1Paint',
                'startP1Unknown',
                'startP1Money',
                'startP2Engine',
                'startP2WetTires',
                'startP2DryTires',
                'startP2Gearbox',
                'startP2Nitro',
                'startP2Mystery',
                'startP2Armour1',
                'startP2Armour2',
                'startP2Armour3',
                'startP2Paint',
                'startP2Unknown',
                'startP2Money',
            ].forEach(function (key) {
                const value = document.getElementById(key).value;
                if (value !== '') opts[key] = parseInt(value, 10);
            });
            return opts;
        }

        function download(bytes, name) {
            const blob = new Blob([bytes], { type: 'application/octet-stream' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = name;
            document.body.appendChild(a);
            a.click();
            a.remove();
            URL.revokeObjectURL(url);
        }

        goBtn.addEventListener('click', function () {
            const file = fileInput.files[0];
            if (!file) { setStatus('Please choose a ROM file first.', 'error'); return; }
            if (!wasm) { setStatus('Module still loading…', 'error'); return; }

            setStatus('Randomizing…');
            const reader = new FileReader();
            reader.onload = function () {
                try {
                    const input = new Uint8Array(reader.result);
                    const opts = buildOptions();
                    const result = wasm.randomizeRom(input, opts);
                    if (!result.success) {
                        setStatus('Error: ' + result.error, 'error');
                        return;
                    }
                    const base = file.name.replace(/\.[^.]+$/, '');
                    const name = base + '.randomized.seed-' + opts.seed + '.sfc';
                    download(result.data, name);
                    setStatus('Done! Downloaded ' + name, 'ok');
                } catch (e) {
                    setStatus('Error: ' + e, 'error');
                }
            };
            reader.onerror = function () { setStatus('Could not read the file.', 'error'); };
            reader.readAsArrayBuffer(file);
        });
    })();
    </script>
</body>
</html>
