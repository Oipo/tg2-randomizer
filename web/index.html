<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Top Gear 2 Randomizer</title>
<style>
    :root { color-scheme: dark; }
    body {
        font-family: system-ui, sans-serif;
        max-width: 640px;
        margin: 2rem auto;
        padding: 0 1rem;
        background: #16181d;
        color: #e6e6e6;
        line-height: 1.5;
    }
    h1 { margin-bottom: 0.25rem; }
    p.sub { margin-top: 0; color: #9aa0a6; }
    fieldset { border: 1px solid #333; border-radius: 8px; margin: 1rem 0; }
    legend { padding: 0 0.4rem; color: #9aa0a6; }
    label { display: block; margin: 0.4rem 0; }
    .row { display: flex; align-items: center; gap: 0.5rem; }
    input[type="number"] { width: 8rem; }
    button {
        font-size: 1rem;
        padding: 0.6rem 1.2rem;
        border: 0;
        border-radius: 8px;
        background: #3b82f6;
        color: white;
        cursor: pointer;
    }
    button:disabled { background: #444; cursor: not-allowed; }
    #status { margin-top: 1rem; min-height: 1.5rem; }
    .error { color: #f87171; }
    .ok { color: #4ade80; }
    code { background: #222; padding: 0.1rem 0.3rem; border-radius: 4px; }
</style>
</head>
<body>
    <h1>Top Gear 2 Randomizer</h1>
    <p class="sub">Everything runs in your browser &mdash; your ROM never leaves your machine.</p>

    <fieldset>
        <legend>ROM</legend>
        <label>Select your Top Gear 2 (USA) ROM:
            <input type="file" id="rom" accept=".sfc,.smc,.bin">
        </label>
    </fieldset>

    <fieldset>
        <legend>Options</legend>
        <label class="row"><input type="checkbox" id="randomizeTracks" checked> Randomize tracks</label>
        <label class="row"><input type="checkbox" id="rampDroneDifficulty" checked> &nbsp;&nbsp;&mdash; ramp drone difficulty by race order (recommended)</label>
        <label class="row"><input type="checkbox" id="randomizeWeather"> Randomize weather</label>
        <label class="row"><input type="checkbox" id="enableSpaceWeather"> &nbsp;&nbsp;&mdash; include "space" weather</label>
        <label class="row">
            Force weather type:
            <select id="weatherType">
                <option value="">(don't force)</option>
                <option value="0">0 - normal</option>
                <option value="1">1 - normal</option>
                <option value="2">2 - normal</option>
                <option value="3">3 - rain</option>
                <option value="4">4 - snow</option>
                <option value="5">5 - fog</option>
                <option value="6">6 - night</option>
                <option value="7">7 - space</option>
            </select>
        </label>
        <label class="row">
            Seed (optional):
            <input type="number" id="seed" placeholder="random" min="0">
        </label>
    </fieldset>

    <button id="go" disabled>Loading…</button>
    <div id="status"></div>

    <!-- MODULARIZE output: defines the global factory createTg2Randomizer() -->
    <script src="tg2-randomizer.js"></script>
    <script>
    (function () {
        const fileInput = document.getElementById('rom');
        const goBtn = document.getElementById('go');
        const statusEl = document.getElementById('status');
        let wasm = null;

        function setStatus(msg, cls) {
            statusEl.textContent = msg;
            statusEl.className = cls || '';
        }

        createTg2Randomizer().then(function (Module) {
            wasm = Module;
            goBtn.textContent = 'Randomize';
            goBtn.disabled = false;
        }).catch(function (e) {
            setStatus('Failed to load WASM module: ' + e, 'error');
        });

        function buildOptions() {
            const opts = {
                randomizeTracks: document.getElementById('randomizeTracks').checked,
                rampDroneDifficulty: document.getElementById('rampDroneDifficulty').checked,
                randomizeWeather: document.getElementById('randomizeWeather').checked,
                enableSpaceWeather: document.getElementById('enableSpaceWeather').checked,
            };
            const wt = document.getElementById('weatherType').value;
            if (wt !== '') opts.weatherType = parseInt(wt, 10);
            // Always resolve to a concrete 32-bit seed (mt19937 is seeded with a
            // uint32), so even "random" runs are reproducible and can be shown.
            const seed = document.getElementById('seed').value;
            opts.seed = (seed !== '') ? (parseInt(seed, 10) >>> 0)
                                      : crypto.getRandomValues(new Uint32Array(1))[0];
            return opts;
        }

        function download(bytes, name) {
            const blob = new Blob([bytes], { type: 'application/octet-stream' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = name;
            document.body.appendChild(a);
            a.click();
            a.remove();
            URL.revokeObjectURL(url);
        }

        goBtn.addEventListener('click', function () {
            const file = fileInput.files[0];
            if (!file) { setStatus('Please choose a ROM file first.', 'error'); return; }
            if (!wasm) { setStatus('Module still loading…', 'error'); return; }

            setStatus('Randomizing…');
            const reader = new FileReader();
            reader.onload = function () {
                try {
                    const input = new Uint8Array(reader.result);
                    const opts = buildOptions();
                    const result = wasm.randomizeRom(input, opts);
                    if (!result.success) {
                        setStatus('Error: ' + result.error, 'error');
                        return;
                    }
                    const base = file.name.replace(/\.[^.]+$/, '');
                    const name = base + '.randomized.seed-' + opts.seed + '.sfc';
                    download(result.data, name);
                    setStatus('Done! Downloaded ' + name, 'ok');
                } catch (e) {
                    setStatus('Error: ' + e, 'error');
                }
            };
            reader.onerror = function () { setStatus('Could not read the file.', 'error'); };
            reader.readAsArrayBuffer(file);
        });
    })();
    </script>
</body>
</html>
